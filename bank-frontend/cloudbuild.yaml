steps:
- name: 'gcr.io/cloud-builders/docker'
  args:
    - 'build'
    - '--build-arg'
    - 'REACT_APP_API_URL=https://omarasaad-bank-backend-79505229087.northamerica-northeast2.run.app'
    - '-t'
    - 'northamerica-northeast2-docker.pkg.dev/$PROJECT_ID/omarasaad-repo/omarasaad-bank-frontend:$SHORT_SHA'
    - 'bank-frontend'

- name: 'gcr.io/cloud-builders/docker'
  args:
    - 'push'
    - 'northamerica-northeast2-docker.pkg.dev/$PROJECT_ID/omarasaad-repo/omarasaad-bank-frontend:$SHORT_SHA'

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    - 'run'
    - 'deploy'
    - 'omarasaad-bank-frontend'
    - '--image=northamerica-northeast2-docker.pkg.dev/$PROJECT_ID/omarasaad-repo/omarasaad-bank-frontend:$SHORT_SHA'
    - '--region=northamerica-northeast2'
    - '--platform=managed'
    - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY