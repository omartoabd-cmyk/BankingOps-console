steps:
- name: 'gcr.io/cloud-builders/docker'
  args:
    - 'build'
    - '-t'
    - 'northamerica-northeast2-docker.pkg.dev/$PROJECT_ID/omarasaad-repo/omarasaad-bank-backend:$SHORT_SHA'
    - '.'

- name: 'gcr.io/cloud-builders/docker'
  args:
    - 'push'
    - 'northamerica-northeast2-docker.pkg.dev/$PROJECT_ID/omarasaad-repo/omarasaad-bank-backend:$SHORT_SHA'

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    - 'run'
    - 'deploy'
    - 'omarasaad-bank-backend'
    - '--image=northamerica-northeast2-docker.pkg.dev/$PROJECT_ID/omarasaad-repo/omarasaad-bank-backend:$SHORT_SHA'
    - '--region=northamerica-northeast2'
    - '--platform=managed'
    - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY